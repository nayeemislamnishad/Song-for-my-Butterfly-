<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For You, With Love 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #ff9a9e 0, #fad0c4 30%, #fcb69f 60%, #2b2d42 100%);
      --card-bg: rgba(17, 24, 39, 0.82);
      --accent: #ff6bcb;
      --accent-soft: rgba(255, 107, 203, 0.12);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border-subtle: rgba(249, 250, 251, 0.08);
      --shadow-soft: 0 25px 50px rgba(15, 23, 42, 0.65);
      --radius-lg: 1.75rem;
      --radius-pill: 999px;
      --transition-fast: 0.18s ease-out;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-image: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      z-index: -2;
    }

    .floating-heart {
      position: fixed;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffe5ec 0, rgba(255, 192, 203, 0.15) 55%, transparent 70%);
      top: -60px;
      right: -40px;
      opacity: 0.9;
      z-index: -1;
      filter: blur(1px);
    }

    .floating-heart.bottom {
      top: auto;
      right: auto;
      left: -60px;
      bottom: -50px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle at 70% 70%, #e0f2fe 0, rgba(59, 130, 246, 0.15) 55%, transparent 70%);
    }

    .page {
      width: 100%;
      max-width: 1080px;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
      gap: 1.75rem;
      align-items: stretch;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 900px) {
      .page {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    /* LEFT: Love message + player */
    .hero-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.94), rgba(15, 23, 42, 0.85));
      border-radius: calc(var(--radius-lg) * 1.1);
      padding: 1.4rem 1.5rem 1.6rem;
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      position: relative;
      overflow: hidden;
    }

    .hero-card::before {
      content: "for you";
      position: absolute;
      right: -40px;
      top: 10px;
      font-size: 5.2rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5rem;
      color: rgba(148, 163, 184, 0.08);
      transform: rotate(-20deg);
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .hero-card::before {
        display: none;
      }
    }

    .hero-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .hero-text {
      max-width: 60%;
    }

    @media (max-width: 900px) {
      .hero-text {
        max-width: 100%;
      }
    }

    .hero-title {
      font-size: clamp(1.65rem, 3vw, 2rem);
      font-weight: 600;
      line-height: 1.25;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .hero-title span.heart {
      display: inline-flex;
      width: 1.85rem;
      height: 1.85rem;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #fecaca 0, #fb7185 40%, #db2777 85%);
      font-size: 1.05rem;
      animation: pulse 1.6s infinite;
      box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.55);
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.55);
      }
      70% {
        transform: scale(1.06);
        box-shadow: 0 0 0 15px transparent;
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 transparent;
      }
    }

    .hero-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
    }

    .dedication-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8rem;
      padding: 0.25rem 0.7rem;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(248, 250, 252, 0.12);
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(148, 163, 184, 0.15));
      margin-top: 0.5rem;
      white-space: nowrap;
    }

    .dedication-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.3);
    }

    .tiny-label {
      font-size: 0.72rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .hero-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.35rem;
      font-size: 0.8rem;
    }

    .date-pill {
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-pill);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.7);
    }

    .hero-note {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    /* PLAYER */
    .player-shell {
      border-radius: calc(var(--radius-lg) * 0.9);
      background: radial-gradient(circle at top left, rgba(248, 113, 113, 0.25), transparent 55%),
                  radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.25), transparent 55%),
                  linear-gradient(145deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.96));
      border: 1px solid rgba(148, 163, 184, 0.35);
      padding: 1.1rem;
      position: relative;
      overflow: hidden;
    }

    .player-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 0%, rgba(251, 113, 133, 0.32), transparent 60%),
        radial-gradient(circle at 80% 100%, rgba(96, 165, 250, 0.35), transparent 60%);
      mix-blend-mode: screen;
      opacity: 0.6;
    }

    .player-inner {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 1rem;
      align-items: center;
    }

    @media (max-width: 700px) {
      .player-inner {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .cover {
      width: 120px;
      height: 120px;
      border-radius: 1.25rem;
      background: radial-gradient(circle at 30% 20%, #fecaca, #fb7185 35%, #4c1d95 85%);
      position: relative;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      isolation: isolate;
    }

    .cover-ring {
      position: absolute;
      width: 95%;
      height: 95%;
      border-radius: inherit;
      border: 2px solid rgba(248, 250, 252, 0.25);
    }

    .cover-heart {
      font-size: 2rem;
      filter: drop-shadow(0 8px 18px rgba(15, 23, 42, 0.8));
      animation: slow-breathe 3s ease-in-out infinite;
    }

    @keyframes slow-breathe {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .track-meta {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .now-playing {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .now-playing-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.32);
    }

    .track-title {
      font-size: 1.15rem;
      font-weight: 600;
    }

    .track-sub {
      font-size: 0.83rem;
      color: var(--text-muted);
    }

    .progress-wrap {
      margin-top: 0.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.35);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-fill {
      position: absolute;
      inset: 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #fb7185, #f97316, #38bdf8);
      transition: width 0.12s linear;
    }

    .progress-handle {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: #f9fafb;
      top: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.7);
      pointer-events: none;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.75rem;
      gap: 1rem;
    }

    .control-group-main {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: rgba(15, 23, 42, 0.95);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast), background var(--transition-fast);
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #e5e7eb;
      stroke-width: 1.7;
    }

    .icon-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.75);
      border-color: rgba(248, 250, 252, 0.6);
    }

    .play-btn {
      width: 54px;
      height: 54px;
      border-radius: 999px;
      border: none;
      background: radial-gradient(circle at 30% 30%, #fee2e2, #fb7185 40%, #c026d3 80%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 18px 30px rgba(248, 113, 113, 0.55);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.12s ease-out, box-shadow 0.12s ease-out;
    }

    .play-btn:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 22px 40px rgba(248, 113, 113, 0.7);
    }

    .play-btn:active {
      transform: translateY(0) scale(0.97);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.9);
    }

    .play-btn svg {
      width: 22px;
      height: 22px;
      fill: #111827;
      stroke: none;
    }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      min-width: 120px;
      justify-content: flex-end;
    }

    .volume-wrap svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #e5e7eb;
      stroke-width: 1.6;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 90px;
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.5);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: #f9fafb;
      box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.4);
      border: 1px solid rgba(15, 23, 42, 0.9);
    }

    .volume-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: #f9fafb;
      box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.4);
      border: 1px solid rgba(15, 23, 42, 0.9);
    }

    .download-current {
      margin-top: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      padding: 0.35rem 0.7rem;
      border-radius: var(--radius-pill);
      border: 1px dashed rgba(248, 250, 252, 0.35);
      background: rgba(15, 23, 42, 0.9);
    }

    .download-current a {
      color: #fbbf24;
      text-decoration: none;
      font-weight: 500;
    }

    .download-current a:hover {
      text-decoration: underline;
    }

    /* RIGHT: Playlist & upload */
    .side-card {
      background: rgba(15, 23, 42, 0.9);
      border-radius: calc(var(--radius-lg) * 1.05);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-soft);
      padding: 1.1rem 1.25rem 1.3rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: 100%;
    }

    .side-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }

    .side-header h2 {
      font-size: 0.98rem;
      font-weight: 600;
    }

    .side-header span {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .side-pill {
      font-size: 0.72rem;
      padding: 0.3rem 0.7rem;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(148, 163, 184, 0.65);
      background: radial-gradient(circle at top left, rgba(236, 72, 153, 0.35), rgba(15, 23, 42, 0.95));
    }

    .playlist-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .search-box {
      margin-bottom: 0.8rem;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.95);
      color: var(--text-main);
      font-size: 0.8rem;
      transition: border-color var(--transition-fast);
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .playlist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
      overflow-y: auto;
      padding-right: 0.25rem;
      max-height: 400px;
    }

    .playlist::-webkit-scrollbar {
      width: 4px;
    }

    .playlist::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.7);
      border-radius: 999px;
    }

    .track-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.55rem 0.65rem;
      border-radius: 0.9rem;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      transition: background var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
    }

    .track-item:hover {
      background: rgba(15, 23, 42, 0.96);
      border-color: rgba(148, 163, 184, 0.55);
      transform: translateY(-1px);
    }

    .track-item.active {
      background: linear-gradient(135deg, rgba(248, 113, 113, 0.2), rgba(59, 130, 246, 0.3));
      border-color: rgba(248, 250, 252, 0.8);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.9);
    }

    .track-main {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex: 1;
      min-width: 0;
    }

    .track-badge {
      width: 26px;
      height: 26px;
      border-radius: 0.75rem;
      background: radial-gradient(circle at 30% 20%, #fee2e2, #fb7185 40%, #4f46e5 85%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .track-texts {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      min-width: 0;
      flex: 1;
    }

    .track-name {
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-note {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-meta-right {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .track-download-link {
      text-decoration: none;
      font-size: 0.72rem;
      padding: 0.26rem 0.5rem;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: rgba(15, 23, 42, 0.95);
      white-space: nowrap;
    }

    .track-download-link:hover {
      border-color: rgba(248, 250, 252, 0.8);
      background: rgba(15, 23, 42, 1);
    }

    .playlist-controls {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.8rem;
      flex-wrap: wrap;
    }

    .playlist-btn {
      font-size: 0.75rem;
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .playlist-btn:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(248, 250, 252, 0.6);
    }

    .upload-box {
      margin-top: 0.6rem;
      padding: 0.7rem 0.75rem;
      border-radius: 1rem;
      border: 1px dashed rgba(148, 163, 184, 0.7);
      background: rgba(15, 23, 42, 0.96);
      font-size: 0.78rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .upload-box label {
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }

    .upload-box input[type="file"] {
      font-size: 0.78rem;
      margin-top: 0.15rem;
    }

    .upload-hint {
      color: var(--text-muted);
      font-size: 0.74rem;
    }

    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    @media (max-width: 480px) {
      body {
        padding: 1.1rem;
      }
      .hero-card,
      .side-card {
        padding: 1rem;
      }
      .track-meta-right {
        display: none;
      }
      .playlist-controls {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="floating-heart"></div>
  <div class="floating-heart bottom"></div>

  <div class="page">
    <!-- LEFT COLUMN -->
    <section class="hero-card">
      <div class="hero-header">
        <div class="hero-text">
          <div class="tiny-label">A private little universe of songs</div>
          <h1 class="hero-title">
            For you, only you
            <span class="heart">❤️</span>
          </h1>
          <p class="hero-subtitle">
            Every song on this page was chosen, written, or recorded thinking about you.
          </p>
          <div class="dedication-pill">
            <span class="dedication-dot"></span>
            <span id="dedication-text">Dedicated to: <strong>My Favorite Human</strong></span>
          </div>
        </div>
        <div class="hero-badge">
          <div class="tiny-label">This moment</div>
          <div class="date-pill" id="today-pill"></div>
        </div>
      </div>

      <p class="hero-note">
        Put your headphones on, close your eyes, and let me sing to you — even when I'm not there beside you.
      </p>

      <!-- PLAYER -->
      <div class="player-shell">
        <div class="player-glow"></div>

        <div class="player-inner">
          <div class="cover">
            <div
